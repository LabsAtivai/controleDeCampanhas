x-common: &common
  build: .
  image: ativa-campanhas:local
  environment:
    DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no stack}
    SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no stack}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL no stack}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no stack}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    TRUST_PROXY: ${TRUST_PROXY:-true}
    ALLOW_LEGACY_TOKEN: ${ALLOW_LEGACY_TOKEN:-false}
    PAINEL_TOKEN: ${PAINEL_TOKEN:-}
    CREDENTIALS_API_URL: ${CREDENTIALS_API_URL:?Configure CREDENTIALS_API_URL no stack}
    CREDENTIALS_API_KEY: ${CREDENTIALS_API_KEY:?Configure CREDENTIALS_API_KEY no stack}
    AVANCOS_API_URL: ${AVANCOS_API_URL:?Configure AVANCOS_API_URL no stack}
    AVANCOS_API_KEY: ${AVANCOS_API_KEY:?Configure AVANCOS_API_KEY no stack}
    AVANCOS_API_KEY_HEADER: ${AVANCOS_API_KEY_HEADER:-X-API-Key}
    AVANCOS_FRONTEND_URL: ${AVANCOS_FRONTEND_URL:-}
    ALLOW_INSECURE_INTEGRATIONS: ${ALLOW_INSECURE_INTEGRATIONS:-false}
    SEMAFORO_TIPOS: ${SEMAFORO_TIPOS:-Interessado}
    INTEGRATION_MAX_STALE_SECONDS: ${INTEGRATION_MAX_STALE_SECONDS:-86400}
    LISTAS_SQUAD_DATABASE_URL: ${LISTAS_SQUAD_DATABASE_URL:-}
    SQUAD_MAPPING_TABLE: ${SQUAD_MAPPING_TABLE:-relatoriolistas.listas_squad}
    GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
    GOOGLE_MASTER_SHEET_ID: ${GOOGLE_MASTER_SHEET_ID:-}
    GOOGLE_CREDENTIALS_FILE: /run/secrets/google_credentials
    PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    TLS_EMAIL: ${TLS_EMAIL:-}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
    SNOV_REQUEST_INTERVAL: ${SNOV_REQUEST_INTERVAL:-1}
  secrets:
    - google_credentials
  init: true
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - default
    - ativaai

services:
  migrate:
    <<: *common
    restart: "no"
    command: ["python", "-m", "manage", "migrate"]
    healthcheck:
      disable: true
  api:
    <<: *common
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default: {}
      ativaai:
        aliases:
          - campanhas-api
  worker:
    <<: *common
    command: ["python", "-m", "core.jobs"]
    stop_grace_period: 60s
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *common
    command: ["python", "app.py"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  backup:
    <<: *common
    command: ["python", "-m", "manage", "backup-loop"]
    user: "0:0"
    volumes:
      - ./backups:/backups
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2.11
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - ativaai

secrets:
  google_credentials:
    file: ${GOOGLE_CREDENTIALS_HOST_PATH:-/dev/null}
volumes:
  caddy_data:
  caddy_config:
networks:
  ativaai:
    external: true
