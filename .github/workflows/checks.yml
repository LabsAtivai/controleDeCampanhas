name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-test-only
          MYSQL_DATABASE: ativa_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      MYSQL_TEST_URL: mysql+pymysql://root:isolated-ci-test-only@127.0.0.1:3306/ativa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps --no-shell chromium
      - run: uv run pytest -q
      - run: uv run python tools/check_secrets.py
      - run: uv run pip-audit --disable-pip --no-deps --require-hashes -r requirements.txt
      - run: docker build -t ativa-campanhas:ci .
